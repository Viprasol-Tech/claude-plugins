name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly: catch a renamed repo or moved plugin
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate marketplace and remote plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Structure
        run: python tests/validate_marketplace.py
      - name: Every plugin path resolves on GitHub
        run: python tests/validate_marketplace.py --remote
